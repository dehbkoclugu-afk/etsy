name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install ".[build]"
      - name: Test
        env:
          PINFORGE_DEBUG: "1"
          PINFORGE_TEST_SQLITE: "1"
        run: python -m pytest
      - name: Package
        shell: pwsh
        run: ./scripts/build_windows.ps1 -SkipInstall
      - uses: actions/upload-artifact@v4
        with:
          name: PinForge-Windows
          path: PinForge-Windows.zip
          if-no-files-found: error
