services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pinforge
      POSTGRES_USER: pinforge
      POSTGRES_PASSWORD: pinforge-local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinforge -d pinforge"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pinforge-postgres:/var/lib/postgresql/data

volumes:
  pinforge-postgres:
