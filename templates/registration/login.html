{% extends "base.html" %}
{% block title %}Log in · PinForge{% endblock %}
{% block content %}
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
  </form>
  <p><a href="{% url 'signup' %}">Create an account</a></p>
{% endblock %}
